[package]
name = "reminder-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "reminder_core"
crate-type = ["cdylib", "lib"]

[dependencies]
jiff = "1.0.0"
rusqlite = { version = "0.42.0", features = ["bundled"] }
uniffi = { workspace = true }
uuid = { version = "1.29.2", features = ["v7"] }

[dev-dependencies]
proptest = "1.12.0"

